[package]
name = "rustsign"
version = "0.3.1"
edition = "2024"

[lib]
name = "rustsign_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
desktop-smoke = []

[[bin]]
name = "rustsign"
path = "src/main.rs"

[dependencies]
# PE file parsing
goblin = { version = "0.8", features = ["pe32", "pe64"] }
# Authenticode digest and signature parsing
authenticode = { version = "0.5", features = ["std", "object"] }
# Object crate for PeFile (needed for authenticode PeTrait)
object = "0.37"
# PEM parsing
pem-rfc7468 = "0.7"
base64 = "0.22"
# CMS/PKCS#7 signature creation
cms = { version = "0.2", features = ["builder", "sha2"] }
# X.509 certificate handling
x509-cert = "0.2"
# PKCS#12 parsing
pkcs12 = "0.1"
p12 = "0.6"
# Cryptography
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
# Digest trait (for Update trait needed by authenticode)
digest = "0.10"
# DER/ASN.1 encoding
der = { version = "0.7", features = ["alloc", "oid", "derive", "pem"] }
# OID definitions
const-oid = { version = "0.9", features = ["db"] }
# HTTP client for timestamp
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls-native-roots", "system-proxy"] }
# Lightweight HTTP server for local TSA
tiny_http = "0.12"
# Error handling
thiserror = "2"
# Tauri
tauri = { version = "2", features = [] }
tauri-runtime = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# UUID generation for certificate IDs
uuid = { version = "1", features = ["v4", "serde"] }
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time"] }
# Data directories
dirs = "5"
# Random number generation
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
webview2-com = "0.38.2"
